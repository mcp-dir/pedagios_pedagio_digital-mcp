# Smithery configuration for Pedágios: Pedágio Digital
# Schema: https://smithery.ai/docs/build/project-config
# Remote HTTP MCP — server hosted at https://api.mcp.ai/p_pedagios_pedagio_digital

name: pedagios_pedagio_digital-mcp
displayName: "Pedágios: Pedágio Digital"
description: >
  Pedágios: Pedágio Digital, consulta em fonte oficial. Hospedado pela plataforma, sem credenciais da plataforma, pague por consulta com crédito pré-pago.

version: 0.1.0
license: MIT
homepage: https://github.com/mcp-dir/pedagios_pedagio_digital-mcp
repository: https://github.com/mcp-dir/pedagios_pedagio_digital-mcp

tags:
  - pedagios_pedagio_digital
  - brazil
  - horizontal
  - read-only

# Remote HTTP MCP — sem startCommand local (servidor já hospedado)
startCommand:
  type: http
  url: https://api.mcp.ai/p_pedagios_pedagio_digital

auth:
  type: oauth2
  resourceMetadataUrl: https://api.mcp.ai/p_pedagios_pedagio_digital/.well-known/oauth-protected-resource
  fallback:
    type: agent-auth
    description: >
      Para clientes sem OAuth 2.1. O agente expõe uma tool authenticate(token).
      Usuário gera o JWT em https://app.mcp.ai/agent-auth e cola no chat.
